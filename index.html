<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Anya! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .scene {
            position: absolute;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: scale(0.95);
            padding: 20px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* ================= SCENE 1: AMPLOP ================= */
        .envelope-wrapper {
            position: relative;
            width: min(320px, 85vw);
            height: min(210px, 55vw);
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background: #f8d7da;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: min(160px, 42.5vw) solid transparent;
            border-right: min(160px, 42.5vw) solid transparent;
            border-top: min(120px, 32vw) solid #f1b0b7;
            transform-origin: top;
            transition: transform 0.6s ease, z-index 0.2s;
            z-index: 3;
        }

        .pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: min(160px, 42.5vw) solid transparent;
            border-right: min(160px, 42.5vw) solid transparent;
            border-bottom: min(110px, 29vw) solid #f5c6cb;
            z-index: 2;
            border-radius: 0 0 12px 12px;
        }

        .letter-preview {
            position: absolute;
            bottom: 10px; left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 70%;
            background: #fff;
            border-radius: 8px;
            z-index: 1;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            color: #ff758c;
            text-align: center;
            padding: 10px;
        }

        .envelope-wrapper.open .flap { transform: rotateX(180deg); z-index: 0; }
        .envelope-wrapper.open .letter-preview { transform: translateX(-50%) translateY(-120px); }
        
        .hint-text { 
            text-align: center; 
            color: white; 
            margin-top: 30px; 
            font-weight: 600; 
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2); 
        }

        /* ================= SCENE 2: KUE & LILIN ================= */
        .cake-container {
            text-align: center;
            position: relative;
            width: 100%;
        }

        .birthday-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
            padding: 0 10px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cake {
            position: relative;
            width: min(250px, 75vw);
            height: min(200px, 60vw);
            margin: 0 auto 30px;
        }

        .layer { position: absolute; width: 100%; border-radius: 10px; }
        .layer-bottom { bottom: 0; height: 40%; background: linear-gradient(to right, #ff9a9e, #fecfef); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .layer-middle { bottom: 40%; height: 35%; width: 90%; left: 5%; background: linear-gradient(to right, #a18cd1, #fbc2eb); border-radius: 10px 10px 5px 5px; }
        .layer-top { bottom: 75%; height: 25%; width: 80%; left: 10%; background: #fff; border-radius: 10px 10px 0 0; background-image: radial-gradient(circle at 10px 10px, #fbc2eb 10px, transparent 11px); background-size: 20px 20px; }

        .candles {
            position: absolute;
            bottom: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: clamp(15px, 5vw, 30px);
        }

        .candle {
            width: clamp(8px, 3vw, 12px);
            height: clamp(30px, 10vw, 40px);
            background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff758c 5px, #ff758c 10px);
            border-radius: 3px;
            position: relative;
        }

        .flame {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: clamp(12px, 4vw, 16px); 
            height: clamp(18px, 6vw, 24px);
            background: radial-gradient(ellipse at bottom, #ffd700 0%, #ff8c00 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ff8c00, 0 0 30px #ffd700;
            animation: flicker 0.1s infinite alternate;
            transition: all 0.5s ease;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 0.8; }
        }

        .cake.blown .flame { opacity: 0; transform: translateX(-50%) scale(0); }
        .cake.blown .candle::after {
            content: '💨';
            position: absolute;
            top: -25px; left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 4vw, 1.5rem);
            animation: smoke 1s ease forwards;
        }

        @keyframes smoke {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
        }

        .blow-btn {
            padding: 12px 30px;
            font-size: clamp(1rem, 3.5vw, 1.2rem);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
            -webkit-tap-highlight-color: transparent;
        }

        .blow-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 117, 140, 0.6); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* ================= SCENE 3: SURAT ================= */
        .letter-card {
            background: rgba(255, 255, 255, 0.95);
            width: 95%;
            max-width: 500px;
            padding: clamp(25px, 6vw, 40px) clamp(20px, 5vw, 30px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
            margin-top: 20px;
        }

        .letter-card::before {
            content: '💌';
            position: absolute;
            top: -25px; left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2.5rem, 8vw, 3rem);
            background: white;
            border-radius: 50%;
            width: clamp(50px, 15vw, 60px); 
            height: clamp(50px, 15vw, 60px);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            color: #ff758c;
            margin-bottom: 15px;
            margin-top: 15px;
        }

        #typewriter-text {
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            line-height: 1.7;
            color: #555;
            text-align: left;
            white-space: pre-wrap;
            min-height: 150px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            background-color: #ff758c;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .continue-btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            display: none;
            animation: fadeIn 1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .continue-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= SCENE 4: BALON LOVE & KEMBANG API ================= */
        #fireworks-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .balloon-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* CSS untuk Balon Bentuk Hati */
        .balloon {
            position: absolute;
            width: clamp(30px, 8vw, 40px);
            height: clamp(30px, 8vw, 40px);
            background: #ff758c;
            transform: rotate(-45deg);
            transition: top 3s cubic-bezier(0.68, -0.55, 0.27, 1.55), left 3s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
            opacity: 0;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
        }

        .balloon::before,
        .balloon::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            box-shadow: inherit;
        }

        .balloon::before { top: -50%; left: 0; }
        .balloon::after { top: 0; left: 50%; }

        /* Tali Balon */
        .balloon .string {
            position: absolute;
            bottom: -25px;
            left: 50%;
            width: 2px;
            height: 25px;
            background: rgba(255,255,255,0.6);
            transform: translateX(-50%) rotate(45deg); /* Counter-rotate agar tali lurus ke bawah */
        }

        .balloon.fly { opacity: 1; }

        .balloon-form-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 1s ease 3.5s;
            z-index: 3;
            text-align: center;
            width: 90%;
            line-height: 1.2;
        }

        .balloon-form-text.show { opacity: 1; }

        /* --- PARTIKEL & CONFETTI --- */
        .particle, .confetti { position: fixed; pointer-events: none; z-index: 0; }
        .particle { bottom: -50px; animation: floatUp linear forwards; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
        .confetti { width: 8px; height: 8px; top: -10px; animation: confettiFall 3s linear forwards; }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .music-control {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.9); border: none;
            border-radius: 50%; width: 50px; height: 50px;
            font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: none; z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 360px) {
            .scene { padding: 15px; }
            .letter-card { padding: 20px 15px; }
            .blow-btn { padding: 10px 25px; }
        }
    </style>
</head>
<body>

    <!-- SCENE 1: AMPLOP -->
    <div class="scene active" id="scene-envelope">
        <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter-preview">Spesial untuk Anya ❤️</div>
            </div>
        </div>
        <div class="hint-text">Klik amplopnya untuk membuka 💌</div>
    </div>

    <!-- SCENE 2: KUE & LILIN -->
    <div class="scene" id="scene-cake">
        <h1 class="birthday-title">Happy Birthday, Anya! 🎉</h1>
        <div class="cake-container">
            <div class="cake" id="cake">
                <div class="candles">
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                    <div class="candle"><div class="flame"></div></div>
                </div>
                <div class="layer layer-top"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-bottom"></div>
            </div>
            <button class="blow-btn" id="blow-btn" onclick="blowCandles()">🌬️ Tiup Lilinnya!</button>
        </div>
    </div>

    <!-- SCENE 3: SURAT -->
    <div class="scene" id="scene-letter">
        <div class="letter-card">
            <h2 class="letter-title">Selamat Ulang Tahun, Anya!</h2>
            <p id="typewriter-text"></p><span class="cursor">|</span>
            <button class="continue-btn" id="continue-btn" onclick="showFireworks()">🎉 Lanjutkan 🎉</button>
        </div>
    </div>

    <!-- SCENE 4: BALON LOVE & KEMBANG API -->
    <div class="scene" id="scene-fireworks">
        <canvas id="fireworks-canvas"></canvas>
        <div class="balloon-container" id="balloon-container"></div>
        <!-- TEKS DIUBAH MENJADI HANYA HAPPY BIRTHDAY ANYA -->
        <div class="balloon-form-text" id="balloon-text">Happy<br>Birthday<br>Anya</div>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" loop>
        <source src="https://happybirthdayanya-ten.vercel.app/lagu.mp3" type="audio/mpeg">
    </audio>
    <button class="music-control" id="music-btn" onclick="toggleMusic()">🎵</button>

    <script>
        let currentScene = 1;
        let isBlown = false;

        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            envelope.classList.add('open');
            
            const audio = document.getElementById('bg-music');
            audio.volume = 0.5; 
            audio.play().catch(e => console.log("Autoplay diblokir browser"));
            document.getElementById('music-btn').style.display = 'block';

            setTimeout(() => {
                switchScene(1, 2);
                createParticles();
            }, 1500);
        }

        function blowCandles() {
            if (isBlown) return;
            isBlown = true;

            const cake = document.getElementById('cake');
            const btn = document.getElementById('blow-btn');
            
            cake.classList.add('blown');
            btn.textContent = '🎉 Yeay! 🎉';
            btn.style.animation = 'none';
            btn.style.background = '#4CAF50';

            createConfetti();

            setTimeout(() => {
                switchScene(2, 3);
                setTimeout(typeWriter, 800);
            }, 2000);
        }

        function switchScene(from, to) {
            document.getElementById(`scene-${getSceneName(from)}`).classList.remove('active');
            setTimeout(() => {
                document.getElementById(`scene-${getSceneName(to)}`).classList.add('active');
            }, 300);
        }

        function getSceneName(num) {
            if (num === 1) return 'envelope';
            if (num === 2) return 'cake';
            if (num === 3) return 'letter';
            if (num === 4) return 'fireworks';
        }

        const message = "Anya! 🌸\n\nHappy Birthday! 🎉\n\nSelamat Ulang Tahunnya dan di hari ulang tahun ini menambah usia kamu yang awalnya 19 menjadi 20, menambah 1 tahun dan makin tua aja tapi.... jangan lupa ampaunya wkwkwkwkk \ncandaaa doang yahh.. anya dan jangan marah-marah terus saat saya masuk room.. \n\nSemoga tahun ini membawa lebih banyak kebahagiaan, rezeki yang lancar, dan momen-momen indah yang tak terlupakan.\n\nHave a wonderful birthday, Anya! 🎂💖";
        
        let index = 0;
        function typeWriter() {
            if (index < message.length) {
                const char = message.charAt(index);
                const displayChar = char === '\n' ? '<br>' : char;
                document.getElementById("typewriter-text").innerHTML += displayChar;
                index++;
                setTimeout(typeWriter, 50);
            } else {
                document.querySelector('.cursor').style.display = 'none';
                document.getElementById('continue-btn').style.display = 'inline-block';
            }
        }

        function createConfetti() {
            const colors = ['#ff758c', '#ff7eb3', '#a18cd1', '#fbc2eb', '#ffd700', '#4CAF50'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function createParticles() {
            const emojis = ['💖', '✨', '🌸', '🎈', '🎀'];
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.fontSize = (Math.random() * 15 + 15) + 'px';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 8000);
            }, 400);
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('music-btn');
            if (audio.paused) {
                audio.play();
                btn.innerHTML = '🎵';
            } else {
                audio.pause();
                btn.innerHTML = '🔇';
            }
        }

        function showFireworks() {
            switchScene(3, 4);
            setTimeout(() => {
                startFireworks();
                createBalloons();
            }, 500);
        }

        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const fireworks = [];
            const particles = [];

            class Firework {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * (canvas.height * 0.5);
                    this.speed = 3 + Math.random() * 2;
                    this.exploded = false;
                    this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                }
                update() {
                    if (!this.exploded) {
                        this.y -= this.speed;
                        if (this.y <= this.targetY) this.explode();
                    }
                }
                explode() {
                    this.exploded = true;
                    const particleCount = 50 + Math.random() * 50;
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle(this.x, this.y, this.color));
                    }
                }
                draw() {
                    if (!this.exploded) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.fill();
                    }
                }
            }

            class Particle {
                constructor(x, y, color) {
                    this.x = x; this.y = y; this.color = color;
                    this.speed = Math.random() * 5 + 2;
                    this.angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                    this.alpha = 1;
                    this.gravity = 0.05;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.vy += this.gravity; this.alpha -= 0.015;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (Math.random() < 0.05) fireworks.push(new Firework());

                for (let i = fireworks.length - 1; i >= 0; i--) {
                    fireworks[i].update(); fireworks[i].draw();
                    if (fireworks[i].exploded) fireworks.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update(); particles[i].draw();
                    if (particles[i].alpha <= 0) particles.splice(i, 1);
                }

                requestAnimationFrame(animate);
            }
            animate();
        }

        function createBalloons() {
            const container = document.getElementById('balloon-container');
            const textElement = document.getElementById('balloon-text');
            const colors = ['#ff758c', '#ff7eb3', '#a18cd1', '#fbc2eb', '#ffd700', '#667eea'];
            
            const balloonCount = window.innerWidth < 768 ? 40 : 60;
            const balloons = [];
            
            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + '%';
                balloon.style.bottom = '-50px';
                balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                // Tambahkan tali ke dalam balon
                const string = document.createElement('div');
                string.className = 'string';
                balloon.appendChild(string);
                
                container.appendChild(balloon);
                balloons.push(balloon);
            }

            setTimeout(() => {
                balloons.forEach((balloon, index) => {
                    setTimeout(() => {
                        balloon.classList.add('fly');
                        const randomTop = 10 + Math.random() * 30;
                        const randomLeft = 10 + Math.random() * 80;
                        balloon.style.top = randomTop + '%';
                        balloon.style.left = randomLeft + '%';
                        balloon.style.bottom = 'auto';
                    }, index * 50);
                });

                setTimeout(() => {
                    textElement.classList.add('show');
                }, 3000);
            }, 500);
        }
    </script>
</body>
</html>
